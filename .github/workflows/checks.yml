name: KhelyIA — vérifications
on:
  pull_request:
  push:
    branches:
      - feat/v3-secure-parent-foundations
jobs:
  tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: npm run check:auth
